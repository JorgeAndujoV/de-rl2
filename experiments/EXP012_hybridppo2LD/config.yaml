experiment: EXP012_hybridppo2LD
seed: 0

# EXP012: byte-for-byte the same experiment as EXP010 (Hybrid PPO on the
# param_strategy_continuous action space), re-run ONLY to record a denser
# training log so the learning / reward curves are smooth. EXP010's log was
# sparse (eval_every was 2000 PPO gradient steps -> ~2 logged rows), which made
# analyze_experiment's learning_curve degenerate; here eval_every drops to 100
# (~37 rows -> the dense 4-panel view) and periodic_eval halves to 500 episodes
# (20 smooth points for learning_progress / actions_evolution). Nothing else
# changes: same agent, action space, observation, reward, functions, budget and
# baselines, so EXP012 is directly comparable to EXP009/EXP011 and supersedes
# EXP010 for reporting. Shares the CONT_ACTION_BASELINES set (identical action
# space), so no baseline is recomputed.

benchmark:
  name: cec13
  functions: [2, 6, 11, 12, 17, 3, 7, 15, 10, 16, 22]
  dim: 30
  budget: 300000

episode:
  pop_size: 50
  warmup_frac: 0.05
  warmup:
    strategy: rand/1/bin
    F: 0.5
    CR: 0.9
  box_center: centroid
  box_scales: [1.0]            # unused (continuous box; see box_scale_range)
  box_min_frac: 0.0417
  elitism: false
  truncate_last_segment: true

environment:                   # identical to EXP010
  observation: traj20_contbox
  n_checkpoints: 20
  action_space: param_strategy_continuous
  f_range: [0.0, 1.0]
  cr_range: [0.0, 1.0]
  budget_range: [0.05, 0.95]
  box_scale_range: [0.25, 3.0]
  strategy_profiles:
    - {strategy: rand/1/bin}
    - {strategy: best/1/bin}
    - {strategy: current-to-best/1/bin}
    - {strategy: rand/2/bin}
  reward:
    name: log_stagnation
    lambda: 0.1
    tau_stag: 3

agent:
  name: hybrid_ppo
  param_dim: 4                 # F, CR, budget_frac, box_scale
  discounting: per_budget
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  policy_hidden: [128, 128]
  value_hidden: [128, 128]
  clip: 0.2
  epochs: 10
  minibatch_size: 64
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  rollout_steps: 512
  n_envs: 8

training:
  # Denser than EXP010: eval_every is in PPO gradient steps (on-policy path),
  # so 100 gives ~37 log rows (the dense learning_curve); periodic_eval is in
  # episodes and feeds the 51-seed learning_progress / actions_evolution curves.
  episodes: 10000
  eval_every: 100
  eval_episodes: 10
  checkpoint_every: 2000
  periodic_eval:
    start: 500
    every: 500

evaluation:
  runs_per_function: 51
  seed_offset: 900000
  save_trajectory_seeds: 3
  baseline_namespace: CONT_ACTION_BASELINES
  compare_against: [BASE001_de_plain, BASE003_random]

slurm:
  time: "5-00:00:00"
  mem: "16G"
  cpus: 8
  gpus: 0
  account: def-bolufe
