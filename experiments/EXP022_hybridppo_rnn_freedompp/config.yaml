experiment: EXP022_hybridppo_rnn_freedompp
seed: 0

# EXP022: EXP021 (freedom++) with a RECURRENT (GRU) Hybrid-PPO agent -- the same
# recurrence swap EXP020 was to EXP016. Identical freedom++ action space
# (param_strategy_freedompp, 4 factored discrete heads + 6 continuous params incl.
# elite_carryover), identical observation (traj20_freedompp, 109 dims), reward,
# functions, budget and 15k-episode scale as EXP021; only the policy/value
# networks become separate GRU trunks (episode-aligned collection, whole-episode
# minibatches with exact hidden-state recompute; multi-head categorical + Beta).
# Shares EXP021's baselines (env/action/obs/reward identical -> agent-independent).

benchmark:
  name: cec13
  functions: [2, 6, 11, 12, 17, 3, 7, 15, 10, 16, 22]
  dim: 30
  budget: 300000

episode:
  pop_size: 50
  warmup_frac: 0.05
  warmup: {strategy: rand/1/bin, F: 0.5, CR: 0.9}
  box_center: centroid
  box_scales: [1.0]
  box_min_frac: 0.0417
  elitism: false
  truncate_last_segment: true

environment:
  observation: traj20_freedompp
  n_checkpoints: 20
  action_space: param_strategy_freedompp
  f_range: [0.0, 1.0]
  cr_range: [0.0, 1.0]
  budget_range: [0.05, 0.95]
  box_scale_range: [0.25, 3.0]
  np_range: [16, 400]
  box_centers: [centroid, incumbent, random]
  elite_range: [0.0, 0.3]
  box_shapes: [axis, covariance]
  sampling_rules: [uniform, halton, opposition]
  strategy_profiles:
    - {strategy: rand/1/bin}
    - {strategy: best/1/bin}
    - {strategy: current-to-best/1/bin}
    - {strategy: rand/2/bin}
    - {strategy: current-to-pbest/1/bin}
  reward: {name: log_stagnation, lambda: 0.1, tau_stag: 3}

agent:
  name: hybrid_ppo_rnn
  param_dim: 6                 # F, CR, budget_frac, box_scale, NP, elite_carryover
  discounting: per_budget
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  cell: gru
  rnn_hidden: 128
  head_hidden: [128]
  clip: 0.2
  epochs: 6
  minibatch_episodes: 32
  episodes_per_update: 256
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  n_envs: 8

training:
  episodes: 15000
  eval_every: 2000
  eval_episodes: 10
  checkpoint_every: 2000
  periodic_eval: {start: 1000, every: 1000}

evaluation:
  runs_per_function: 51
  seed_offset: 900000
  save_trajectory_seeds: 3
  # Reuse EXP021's freedom++ baselines (identical env/action/obs/reward ->
  # baselines are agent-independent).
  baseline_namespace: BASE_FREEDOMPP
  compare_against: [BASE001_de_plain, BASE003_random]

slurm:
  time: "5-00:00:00"
  mem: "16G"
  cpus: 8
  gpus: 0
  account: def-bolufe
