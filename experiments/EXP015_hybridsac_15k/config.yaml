experiment: EXP015_hybridsac_15k
seed: 0

# EXP015: EXP011 (Hybrid SAC on param_strategy_continuous) trained for 15k
# episodes instead of 10k -> 15 periodic checkpoints. Everything else identical.
# Re-run on the CORRECTED CEC'13 benchmark. Shares the continuous-space axis-box
# baseline set with EXP014 (same configuration, different agent).

benchmark:
  name: cec13
  functions: [2, 6, 11, 12, 17, 3, 7, 15, 10, 16, 22]
  dim: 30
  budget: 300000

episode:
  pop_size: 50
  warmup_frac: 0.05
  warmup: {strategy: rand/1/bin, F: 0.5, CR: 0.9}
  box_center: centroid
  box_scales: [1.0]
  box_min_frac: 0.0417
  elitism: false
  truncate_last_segment: true

environment:
  observation: traj20_contbox
  n_checkpoints: 20
  action_space: param_strategy_continuous
  f_range: [0.0, 1.0]
  cr_range: [0.0, 1.0]
  budget_range: [0.05, 0.95]
  box_scale_range: [0.25, 3.0]
  strategy_profiles:
    - {strategy: rand/1/bin}
    - {strategy: best/1/bin}
    - {strategy: current-to-best/1/bin}
    - {strategy: rand/2/bin}
  reward: {name: log_stagnation, lambda: 0.1, tau_stag: 3}

agent:
  name: hybrid_sac
  param_dim: 4
  discounting: per_budget
  gamma: 0.99
  lr: 3.0e-4
  actor_hidden: [256, 256]
  critic_hidden: [256, 256]
  buffer_size: 100000
  batch_size: 256
  warmup_transitions: 1000
  tau_polyak: 0.995
  initial_alpha: 0.1
  target_entropy_disc_ratio: 0.5
  max_grad_norm: 10.0

training:
  episodes: 15000              # -> 15 periodic checkpoints (every 1000)
  eval_every: 2000
  eval_episodes: 10
  checkpoint_every: 2000
  periodic_eval: {start: 1000, every: 1000}

evaluation:
  runs_per_function: 51
  seed_offset: 900000
  save_trajectory_seeds: 3
  baseline_namespace: BASE_CONT_AXIS       # shared with EXP014 (same config)
  compare_against: [BASE001_de_plain, BASE003_random]

slurm:
  time: "5-00:00:00"
  mem: "16G"
  cpus: 4
  gpus: 0
  account: def-bolufe
