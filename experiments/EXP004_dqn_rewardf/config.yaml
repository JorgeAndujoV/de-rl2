experiment: EXP004_dqn_rewardf
seed: 0

# EXP004 = EXP003's six-function sweep with FOUR deliberate changes to the MDP,
# to test whether reward shaping + a wider action menu moves performance. Same
# agent, observation, DE core, per-strategy F/CR, episodes (10,000), checkpoint
# cadence (chkp1..chkp10), and one Slurm job PER FUNCTION as EXP003. The changes:
#
#   1. Reward -> log-improvement ("log_stagnation"): reward is the reduction in
#      log10(error) per segment, so a fixed FACTOR reduction is worth the same
#      reward at any scale. Fixes the raw reward's ~5-order first-segment
#      dominance (which starved late-episode credit and destabilised the DQN).
#   2. budget_fracs -> [0.025, 0.10, 0.25]: a smaller minimum (more restarts,
#      which the multimodal functions saturated toward under EXP003) AND a much
#      larger maximum 0.25 (fewer/longer restarts, toward the single-long-run
#      behaviour that beat the agent on f2/f17). The menu is still 3 wide, so the
#      action space stays 4x3x5 = 60 and the 101-feature observation is unchanged.
#   3. box_scales -> [3.0, 1.5, 1.0, 0.5, 0.25]: both extremes pushed out (wider
#      widest for exploration, tighter tightest for exploitation) since the
#      agent's usage concentrated on the two end boxes in EXP003. Same 5 boxes,
#      so no action-count change.
#   4. warmup_frac -> 0.025: the warm-up DE segment now uses 2.5% of the budget
#      (was 5%), matching the new smallest agent segment.
#
# NOTE ON DISCOUNTING: the SMDP tau unit is the SMALLEST budget fraction of this
# experiment (env.py derives it from budget_fracs), so here it is 0.025 — one
# smallest agent segment = 1 tau, self-consistent within EXP004. This does change
# the effective gamma^tau horizon vs EXP003 (an episode now spans up to ~40 tau
# rather than 20); that is intended — the discounting is a property of each
# experiment's own budget menu, not a constant shared across experiments.
#
# Baselines are namespaced and GENERATED BY THE JOB: each per-function job first
# produces this experiment's three baselines into baselines/EXP004_dqn_rewardf/
# f<N>/<method>/ (once, reused by all 10 checkpoint evaluations), then trains.
# They differ from EXP003's because warmup/box/budget changed.

benchmark:
  name: cec13
  # The six-function sweep. Each is trained by its own job (run_experiment.sh
  # --function N, or the no-arg fan-out submits one job per function).
  functions: [2, 8, 11, 12, 17, 24]
  dim: 30
  budget: 300000               # total FEs per episode

episode:
  pop_size: 50
  warmup_frac: 0.025           # CHANGED (was 0.05): warm-up uses 2.5% of budget
  warmup:
    strategy: rand/1/bin
    F: 0.5
    CR: 0.9
  box_center: centroid         # centroid | incumbent
  box_scales: [3.0, 1.5, 1.0, 0.5, 0.25]   # CHANGED: extremes widened both ways
  box_min_frac: 0.0417         # 1/24
  elitism: false
  truncate_last_segment: true

environment:
  observation: traj20
  n_checkpoints: 20
  action_space: profiles_budget_area
  budget_fracs: [0.025, 0.10, 0.25]        # CHANGED (was [0.05,0.10,0.15])
  # Per-strategy F/CR (same as EXP003): each strategy carries its own fixed
  # parameters. F/CR remain outside the action space; the agent chooses the
  # strategy, and the strategy fixes F/CR.
  strategy_profiles:
    - {strategy: rand/1/bin,            F: 0.5, CR: 0.9}
    - {strategy: best/1/bin,            F: 0.8, CR: 0.5}
    - {strategy: current-to-best/1/bin, F: 0.5, CR: 0.3}
    - {strategy: rand/2/bin,            F: 0.5, CR: 0.3}
  reward:
    name: log_stagnation       # CHANGED (was stagnation): log10-error reduction
    lambda: 0.1                # now on an O(1) scale — an active term (see rewards.py)
    tau_stag: 3

agent:
  name: dqn
  discounting: per_budget      # per_budget | per_step
  gamma: 0.99
  lr: 1.0e-3
  hidden: [100, 75, 50]
  buffer_size: 100000
  batch_size: 64
  target_update: 500
  warmup_transitions: 100
  # Epsilon decays over the first 40k TRAINING STEPS. Note the new 0.025 minimum
  # budget_frac lets episodes contain more (shorter) segments, i.e. more steps
  # per episode, so 40k steps may cover fewer than EXP003's ~3100 episodes — the
  # AMOUNT of exploration (40k gradient steps) is unchanged, only its span in
  # episode terms. Left as-is to isolate the four changes; revisit if the
  # learning curve shows epsilon reaching the floor too early.
  epsilon: {start: 1.0, end: 0.05, decay_steps: 40000}

training:
  episodes: 10000
  eval_every: 2000             # training steps between learning-curve points
  eval_episodes: 10            # rollouts averaged per learning-curve point
  checkpoint_every: 2000       # training steps between resume checkpoints
  # Episode-based full evaluation at episodes 1000, 2000, ..., 10000.
  periodic_eval:
    start: 1000
    every: 1000

evaluation:
  runs_per_function: 51
  seed_offset: 900000          # eval seeds must not overlap training seeds
  save_trajectory_seeds: 3     # persist full within-segment trajectories for N seeds/function
  # Frozen per-function baselines produced by scripts/run_baseline.py against
  # THIS config, into baselines/EXP004_dqn_rewardf/f<N>/<method>/. They MUST be
  # regenerated for EXP004 (warmup/box/budget changed vs EXP003), and are checked
  # for function/dim/budget/seed parity. E.g.:
  #   python -m scripts.run_baseline --baseline BASE001_de_plain       --config experiments/EXP004_dqn_rewardf/config.yaml --function 2
  #   python -m scripts.run_baseline --baseline BASE002_fixed_schedule --config experiments/EXP004_dqn_rewardf/config.yaml --function 2
  #   python -m scripts.run_baseline --baseline BASE003_random         --config experiments/EXP004_dqn_rewardf/config.yaml --function 2
  # (omit --function to produce a method for every function in one command).
  compare_against: [BASE001_de_plain, BASE002_fixed_schedule, BASE003_random]

slurm:                         # cluster resources; read by run_experiment.sh
  time: "5-00:00:00"           # 5 days per function/job
  mem: "16G"
  cpus: 4
  gpus: 0                      # CPU-only: the DE core syncs per generation, so a GPU is slower here
  account: def-bolufe          # <-- EDIT if your Nibi allocation differs
