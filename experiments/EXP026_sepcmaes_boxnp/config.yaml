experiment: EXP026_sepcmaes_boxnp
seed: 0

# EXP026: EXP016's setup (boxnp action space, traj20_contboxnp observation, same
# MLP policy architecture and deterministic decode -- argmax on the discrete
# head, Beta-mean on the continuous heads) trained with SEPARABLE CMA-ES
# (evosax) instead of PPO. No critic: ES searches only the policy net's weights.
# Each population member is scored by one full greedy episode; fitness =
# -log10(final_best_error + 1e-8) at the full FE budget (ES optimises the eval
# metric directly, NOT PPO's log_stagnation return -- deliberately its own best
# configuration, not a controlled-objective match). Evaluated the repo-standard
# way against BASE001_de_plain (plainDE) and BASE003_random (random). Trained one
# function per job. Strictly additive: new agent/loop/pool modules, no edits to
# the PPO agent, train.py, env, observation or action-space code.

benchmark:
  name: cec13
  functions: [2, 6, 11, 12, 17, 3, 7, 15, 10, 16, 22]
  dim: 30
  budget: 300000

episode:
  pop_size: 50                 # warm-up NP (fixed); agent sets NP per segment
  warmup_frac: 0.05
  warmup: {strategy: rand/1/bin, F: 0.5, CR: 0.9}
  box_center: centroid         # fallback; the agent chooses per segment
  box_scales: [1.0]
  box_min_frac: 0.0417
  elitism: false
  truncate_last_segment: true

environment:
  observation: traj20_contboxnp
  n_checkpoints: 20
  action_space: param_strategy_boxnp
  f_range: [0.0, 1.0]
  cr_range: [0.0, 1.0]
  budget_range: [0.05, 0.95]
  box_scale_range: [0.25, 3.0]
  np_range: [16, 400]
  box_centers: [centroid, incumbent, random]
  strategy_profiles:
    - {strategy: rand/1/bin}
    - {strategy: best/1/bin}
    - {strategy: current-to-best/1/bin}
    - {strategy: rand/2/bin}
    - {strategy: current-to-pbest/1/bin}
  # The env still computes a reward per step; Sep-CMA-ES ignores it (fitness is
  # final error). Kept identical to EXP016 so the environment is byte-identical.
  reward: {name: log_stagnation, lambda: 0.1, tau_stag: 3}

# `agent` here documents the policy net that Sep-CMA-ES optimises; it is NOT built
# through the agent registry (train_es.py reads param_dim + policy_hidden and
# reuses the Hybrid-PPO net directly). Same MLP shape as EXP016.
agent:
  name: sep_cmaes
  param_dim: 5                 # F, CR, budget_frac, box_scale, NP
  policy_hidden: [128, 128]

es:
  population_size: 64          # perturbed weight vectors per generation (even -> antithetic)
  num_generations: 300         # explicit, independent of population_size
  workers: 8                   # LOCAL default; Slurm sets this to the core count
  elite_ratio: 0.3             # evosax reference sweep: {0.2, 0.3, 0.4, 0.5}
  sigma_init: 0.05             # initial per-parameter step size
  antithetic: true             # mirrored perturbations around the mean (needs even population)
  checkpoint_every: 10         # generations between resume checkpoints (es_state.pkl + mean.npy)
  eval_every: 20               # generations between mean-policy validation monitors (eval_log.csv)
  eval_runs: 8                 # validation episodes per monitor (seed band 8e5; distinct from 9e5 final eval)

evaluation:
  runs_per_function: 51
  seed_offset: 900000
  save_trajectory_seeds: 3
  # Agent-independent baselines: identical env/action/obs to EXP016, so the
  # boxnp+axis set is valid unchanged. BASE001_de_plain = plainDE, BASE003_random
  # = random (both already the repo standard; f3 baseline generated with EXP023).
  baseline_namespace: BASE_BOXNP_AXIS
  compare_against: [BASE001_de_plain, BASE003_random]

slurm:
  time: "1-00:00:00"
  mem: "16G"
  cpus: 64                     # population-parallel; raised from 8 -> cores
  gpus: 0
  account: def-bolufe
