experiment: EXP014_hybridppo_15k
seed: 0

# EXP014: EXP010 (Hybrid PPO on param_strategy_continuous) trained for 15k
# episodes instead of 10k -> 15 periodic checkpoints. Everything else identical.
# Re-run on the CORRECTED CEC'13 benchmark, so it needs its own (fresh) baselines.
# Dense reward/loss curves come from progress_log.csv; the PPO divergence guard
# is now in the agent.

benchmark:
  name: cec13
  functions: [2, 6, 11, 12, 17, 3, 7, 15, 10, 16, 22]
  dim: 30
  budget: 300000

episode:
  pop_size: 50
  warmup_frac: 0.05
  warmup: {strategy: rand/1/bin, F: 0.5, CR: 0.9}
  box_center: centroid
  box_scales: [1.0]
  box_min_frac: 0.0417
  elitism: false
  truncate_last_segment: true

environment:
  observation: traj20_contbox
  n_checkpoints: 20
  action_space: param_strategy_continuous
  f_range: [0.0, 1.0]
  cr_range: [0.0, 1.0]
  budget_range: [0.05, 0.95]
  box_scale_range: [0.25, 3.0]
  strategy_profiles:
    - {strategy: rand/1/bin}
    - {strategy: best/1/bin}
    - {strategy: current-to-best/1/bin}
    - {strategy: rand/2/bin}
  reward: {name: log_stagnation, lambda: 0.1, tau_stag: 3}

agent:
  name: hybrid_ppo
  param_dim: 4
  discounting: per_budget
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  policy_hidden: [128, 128]
  value_hidden: [128, 128]
  clip: 0.2
  epochs: 10
  minibatch_size: 64
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  rollout_steps: 512
  n_envs: 8

training:
  episodes: 15000              # -> 15 periodic checkpoints (every 1000)
  eval_every: 2000
  eval_episodes: 10
  checkpoint_every: 2000
  periodic_eval: {start: 1000, every: 1000}

evaluation:
  runs_per_function: 51
  seed_offset: 900000
  save_trajectory_seeds: 3
  # One baseline set per CONFIGURATION (continuous action space + axis box),
  # shared with EXP015 (same config, different agent); NOT per agent.
  baseline_namespace: BASE_CONT_AXIS
  compare_against: [BASE001_de_plain, BASE003_random]

slurm:
  time: "5-00:00:00"
  mem: "16G"
  cpus: 8
  gpus: 0
  account: def-bolufe
