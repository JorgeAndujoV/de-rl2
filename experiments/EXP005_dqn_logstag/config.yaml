experiment: EXP005_dqn_logstag
seed: 0

# EXP005-EXP008 are a REWARD ABLATION: identical to EXP003 in every respect
# (agent, observation, DE core, per-strategy F/CR, 60-action menu, box_scales,
# budget_fracs, warmup, episodes, checkpoint cadence, one Slurm job per function)
# EXCEPT the reward function. Isolating the reward is the whole point, so nothing
# else moves — box_scales and budget_fracs are EXP003's, NOT EXP004's, and the
# SMDP tau unit is therefore min(budget_fracs) = 0.05, matching EXP003 exactly.
#
# The one shared change vs EXP003 is the function set: f8 (Rotated Ackley) is
# replaced by f6 (Rotated Rosenbrock). f8 was uninformative — every method sat on
# the Ackley outer plateau (~0.2% spread between agent and baselines), so it could
# not discriminate optimizer behaviour. f6 adds a non-separable narrow-valley
# problem that rewards sustained exploitation and punishes over-restarting, and on
# which DE makes real progress (a measurable gap to compare). The reward effect is
# read primarily on the four functions shared with EXP003 (f2, f11, f12, f24),
# so that comparison is against EXP003's own numbers and is not biased by f6/f17.
#
# EXP005's reward: log-improvement WITH stagnation penalty (= EXP004's reward, on
# EXP003's action space). R_t = log10(e_{t-1}+c) - log10(e_t+c) - lambda*penalty,
# + (-log10(e_0+c)) at t=1; telescopes to -log10(e_final+c). A fixed FACTOR
# reduction is worth the same reward anywhere in the episode, so late fine-tuning
# gets credit and TD targets stay O(1). lambda is on an O(1) scale here (active,
# unlike under the raw reward). See src/derl2/environments/rewards.py.

benchmark:
  name: cec13
  # f8 -> f6 (see header). Each function is trained by its own job.
  functions: [2, 6, 11, 12, 17, 24]
  dim: 30
  budget: 300000               # total FEs per episode

episode:
  pop_size: 50
  warmup_frac: 0.05
  warmup:
    strategy: rand/1/bin
    F: 0.5
    CR: 0.9
  box_center: centroid         # centroid | incumbent
  box_scales: [2.0, 1.5, 1.0, 0.667, 0.5]   # EXP003 values (unchanged)
  box_min_frac: 0.0417         # 1/24
  elitism: false
  truncate_last_segment: true

environment:
  observation: traj20
  n_checkpoints: 20
  action_space: profiles_budget_area
  budget_fracs: [0.05, 0.10, 0.15]          # EXP003 values (unchanged) -> tau unit 0.05
  strategy_profiles:
    - {strategy: rand/1/bin,            F: 0.5, CR: 0.9}
    - {strategy: best/1/bin,            F: 0.8, CR: 0.5}
    - {strategy: current-to-best/1/bin, F: 0.5, CR: 0.3}
    - {strategy: rand/2/bin,            F: 0.5, CR: 0.3}
  reward:
    name: log_stagnation       # log-improvement + stagnation penalty
    lambda: 0.1                # active on the O(1) log scale
    tau_stag: 3

agent:
  name: dqn
  discounting: per_budget      # per_budget | per_step
  gamma: 0.99
  lr: 1.0e-3
  hidden: [100, 75, 50]
  buffer_size: 100000
  batch_size: 64
  target_update: 500
  warmup_transitions: 100
  epsilon: {start: 1.0, end: 0.05, decay_steps: 40000}

training:
  episodes: 10000
  eval_every: 2000             # training steps between learning-curve points
  eval_episodes: 10            # rollouts averaged per learning-curve point
  checkpoint_every: 2000       # training steps between resume checkpoints
  periodic_eval:
    start: 1000
    every: 1000

evaluation:
  runs_per_function: 51
  seed_offset: 900000          # eval seeds must not overlap training seeds
  save_trajectory_seeds: 3     # persist full within-segment trajectories for N seeds/function
  # Frozen per-function baselines, GENERATED BY THE JOB into
  # baselines/EXP005_dqn_logstag/f<N>/<method>/ (reward-independent, so identical
  # to EXP006/007/008's; checked for function/dim/budget/seed parity).
  compare_against: [BASE001_de_plain, BASE002_fixed_schedule, BASE003_random]

slurm:                         # cluster resources; read by run_experiment.sh
  time: "5-00:00:00"           # 5 days per function/job
  mem: "16G"
  cpus: 4
  gpus: 0                      # CPU-only: the DE core syncs per generation, so a GPU is slower here
  account: def-bolufe          # <-- EDIT if your Nibi allocation differs
